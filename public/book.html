<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container py-4">
    <!-- Back link -->
    <a href="index.html" class="btn btn-outline-secondary mb-4">&larr; Back to books</a>

    <!-- Specific book section: larger image, author, published year, title, description, genres -->
    <div id="book-message"></div>
    <div id="book" class="row g-4 mb-5"></div>

    <!-- Create new review section -->
    <div class="row">
      <div class="col-md-6">
        <h2 class="h4">Write a review</h2>
        <div id="review-form-message"></div>
        <form id="review-form" class="mb-4">
          <div class="mb-3">
            <label for="review-name" class="form-label">Name</label>
            <input type="text" class="form-control" id="review-name" required>
          </div>
          <div class="mb-3">
            <label for="review-rating" class="form-label">Rating (1-5)</label>
            <input type="number" class="form-control" id="review-rating" min="1" max="5" required>
          </div>
          <div class="mb-3">
            <label for="review-content" class="form-label">Review</label>
            <textarea class="form-control" id="review-content" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit review</button>
        </form>
      </div>

      <!-- List of reviews belonging to this book -->
      <div class="col-md-6">
        <h2 class="h4">Reviews</h2>
        <div id="reviews"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/functions.js"></script>
  <script src="js/book.js"></script>
</body>
</html>
