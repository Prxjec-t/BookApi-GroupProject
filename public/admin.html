<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <h1 class="mb-4">Admin panel</h1>

    <!-- Users table -->
    <section class="mb-5">
      <h2 class="h4">Users</h2>
      <div id="users-message"></div>
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Username</th>
              <th>Admin</th>
              <th>Created at</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Create book form -->
    <section class="mb-5">
      <h2 class="h4">Add a new book</h2>
      <div id="book-form-message"></div>
      <form id="book-form" class="row g-3">
        <div class="col-md-6">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" id="title" required>
        </div>
        <div class="col-md-6">
          <label for="author" class="form-label">Author</label>
          <input type="text" class="form-control" id="author" required>
        </div>
        <div class="col-md-12">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" rows="3"></textarea>
        </div>
        <div class="col-md-6">
          <label for="genres" class="form-label">Genres (comma separated)</label>
          <input type="text" class="form-control" id="genres" placeholder="Fantasy, Adventure">
        </div>
        <div class="col-md-6">
          <label for="image" class="form-label">Image URL</label>
          <input type="text" class="form-control" id="image">
        </div>
        <div class="col-md-6">
          <label for="published_year" class="form-label">Published year</label>
          <input type="number" class="form-control" id="published_year">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Create book</button>
        </div>
      </form>
    </section>

    <!-- Books table -->
    <section class="mb-5">
      <h2 class="h4">Books</h2>
      <div id="books-message"></div>
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Genres</th>
              <th>Published year</th>
            </tr>
          </thead>
          <tbody id="books-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/functions.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
